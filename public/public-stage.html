<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sténtor — Schermo di proiezione</title>
  <style>
    /* Font inclusi nell'app: gli stessi di src/styles/fonts.css. */
    @font-face {
      font-family: "Atkinson Hyperlegible";
      src: url("fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Atkinson Hyperlegible";
      src: url("fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: "Atkinson Hyperlegible";
      src: url("fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Atkinson Hyperlegible";
      src: url("fonts/atkinson-hyperlegible/AtkinsonHyperlegible-BoldItalic.ttf") format("truetype");
      font-weight: 700;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: "OpenDyslexic";
      src: url("fonts/opendyslexic/OpenDyslexic-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "OpenDyslexic";
      src: url("fonts/opendyslexic/OpenDyslexic-Italic.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: "OpenDyslexic";
      src: url("fonts/opendyslexic/OpenDyslexic-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "OpenDyslexic";
      src: url("fonts/opendyslexic/OpenDyslexic-BoldItalic.woff2") format("woff2");
      font-weight: 700;
      font-style: italic;
      font-display: swap;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      cursor: none;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    #canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2360px;
      height: 800px;
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(1);
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: visible;
      background: #000000;
    }

    /* Ogni battuta è un livello a sé: durante il passaggio convivono quello che esce e quello che entra. */
    .subtitleLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: none;
      opacity: 1;
    }

    .stage-line {
      white-space: pre;
    }

    .hint {
      position: fixed;
      left: 18px;
      bottom: 14px;
      color: rgba(255,255,255,0.35);
      font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    body:hover .hint { opacity: 1; }

    .emptyNotice {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.22);
      font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    body.debug-empty .emptyNotice { opacity: 1; }


  </style>
</head>
<body>
  <main id="stage">
    <div id="canvas">
    </div>
  </main>
  <div class="hint">Doppio clic: tutto schermo · Esc: esci</div>
  <div class="emptyNotice">In attesa dello schermo di proiezione di Sténtor…</div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const SCREEN_ID = params.get('i') || params.get('screenId') || '';
      const SCREEN_NAME = params.get('screenName') || 'Schermo di proiezione';
      const PAYLOAD_KEY = SCREEN_ID
        ? `stentore-public-stage-payload-${SCREEN_ID}`
        : 'stentore-public-stage-payload';
      document.title = `Sténtor — ${SCREEN_NAME}`;
      const DESIGN_WIDTH = 2360;
      const DESIGN_HEIGHT = 800;
      const stage = document.getElementById('stage');
      const canvas = document.getElementById('canvas');
      let currentLayer = null;
      let leavingLayers = [];
      let layerCounter = 0;
      let lastRawText = null;
      let lastPayload = null;
      let lastUpdatedAt = 0;

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function updateScale() {
        const width = window.innerWidth || stage.clientWidth || 1;
        const height = window.innerHeight || stage.clientHeight || 1;
        const scale = Math.min(width / DESIGN_WIDTH, height / DESIGN_HEIGHT);
        canvas.style.transform = `translate(-50%, -50%) scale(${scale || 1})`;
      }

      function parsePixels(value, fallback = 58) {
        const parsed = parseFloat(String(value || '').replace('px', ''));
        return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
      }

      function parsePercent(value, fallback = 90) {
        const parsed = parseFloat(String(value || '').replace('%', ''));
        return Number.isFinite(parsed) && parsed > 0 ? Math.max(1, Math.min(100, parsed)) : fallback;
      }

      function parseVh(value, fallback = 0) {
        const parsed = parseFloat(String(value || '').replace('vh', ''));
        return Number.isFinite(parsed) ? parsed : fallback;
      }

      function parseOffset(value) {
        const parsed = Number.parseFloat(value);
        return Number.isFinite(parsed) ? Math.max(-100, Math.min(100, parsed)) : 0;
      }

      function getCenterY(verticalAlign, paddingTop) {
        const offset = (parseVh(paddingTop, 0) / 100) * DESIGN_HEIGHT;
        if (verticalAlign === 'top') return DESIGN_HEIGHT * 0.26 + offset;
        if (verticalAlign === 'bottom') return DESIGN_HEIGHT * 0.74 + offset;
        // «Centro» è il centro esatto: il margine dall'alto vale solo per le posizioni Alto e Basso.
        return DESIGN_HEIGHT * 0.5;
      }

      function createSvgElement(name, attributes = {}) {
        const element = document.createElementNS('http://www.w3.org/2000/svg', name);
        Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
        return element;
      }


      function parseInlineFormatting(text = '') {
        const value = String(text || '');
        const segments = [];
        let index = 0;
        let italic = false;
        let buffer = '';

        function pushBuffer() {
          if (!buffer) return;
          segments.push({ text: buffer, italic });
          buffer = '';
        }

        while (index < value.length) {
          if (value.startsWith('<i>', index)) {
            pushBuffer();
            italic = true;
            index += 3;
            continue;
          }
          if (value.startsWith('</i>', index)) {
            pushBuffer();
            italic = false;
            index += 4;
            continue;
          }
          if (value.startsWith('<em>', index)) {
            pushBuffer();
            italic = true;
            index += 4;
            continue;
          }
          if (value.startsWith('</em>', index)) {
            pushBuffer();
            italic = false;
            index += 5;
            continue;
          }
          buffer += value[index];
          index += 1;
        }

        pushBuffer();
        return segments.length ? segments : [{ text: '', italic: false }];
      }

      function styledLineSegments(line, lineStart, spans) {
        var lineEnd = lineStart + line.length;
        var relevant = (Array.isArray(spans) ? spans : []).filter(function(span) {
          return Number(span.end) > lineStart && Number(span.start) < lineEnd;
        });
        if (!line.length) return [{ text: '\u00A0' }];
        if (!relevant.length) return [{ text: line }];
        var boundaries = [lineStart, lineEnd];
        relevant.forEach(function(span) {
          boundaries.push(Math.max(lineStart, Number(span.start) || 0));
          boundaries.push(Math.min(lineEnd, Number(span.end) || 0));
        });
        boundaries = boundaries.filter(function(value, index, values) {
          return value >= lineStart && value <= lineEnd && values.indexOf(value) === index;
        }).sort(function(a, b) { return a - b; });
        var result = [];
        for (var i = 0; i < boundaries.length - 1; i += 1) {
          var start = boundaries[i];
          var end = boundaries[i + 1];
          if (end <= start) continue;
          var style = {};
          relevant.forEach(function(span) {
            if (Number(span.start) <= start && Number(span.end) >= end) {
              ['bold', 'italic', 'underline', 'color', 'fontScale'].forEach(function(key) {
                if (Object.prototype.hasOwnProperty.call(span, key)) style[key] = span[key];
              });
            }
          });
          result.push(Object.assign({ text: line.slice(start - lineStart, end - lineStart) }, style));
        }
        return result;
      }

      // Stesso calcolo di src/utils/stageLayout.js (layoutStageText): tenerli allineati.
      function layoutStageText(lineCount, secondLineCount, fontPx, secondScale, centerY, verticalAlign) {
        const lineHeight = fontPx * 1.12;
        const primaryHeight = lineCount * lineHeight;
        const hasSecond = lineCount > 0 && secondLineCount > 0;
        const scale = Number.isFinite(Number(secondScale)) ? Math.max(50, Math.min(90, Number(secondScale))) : 70;
        const secondFontPx = fontPx * (scale / 100);
        const secondLineHeight = secondFontPx * 1.12;
        const gapAbove = fontPx * 0.42;
        const gapBelow = fontPx * 0.6;
        const totalHeight = primaryHeight + (hasSecond ? gapAbove + gapBelow + secondLineCount * secondLineHeight : 0);
        let top = centerY - primaryHeight / 2;
        if (hasSecond && verticalAlign === 'bottom') top = centerY + primaryHeight / 2 - totalHeight;
        else if (hasSecond && verticalAlign !== 'top') top = centerY - totalHeight / 2;
        const primaryY = [];
        for (let i = 0; i < lineCount; i += 1) primaryY.push(top + lineHeight * (i + 0.5));
        if (!hasSecond) return { primaryY, secondY: [], separator: null, secondFontPx };
        const separatorY = top + primaryHeight + gapAbove;
        const secondY = [];
        for (let i = 0; i < secondLineCount; i += 1) secondY.push(separatorY + gapBelow + secondLineHeight * (i + 0.5));
        return { primaryY, secondY, secondFontPx, separator: { y: separatorY, width: fontPx * 1.1, thickness: Math.max(2, fontPx * 0.045) } };
      }

      // Stesso calcolo di src/utils/stageLayout.js (fitStageShiftX): tenerli allineati.
      // Una riga lunga, spostata di lato, viene riavvicinata quanto basta per restare nello schermo.
      function fitStageShiftX(centerX, lineWidth, clipWidth) {
        const margin = 24;
        const visible = Math.min(lineWidth || 0, clipWidth || 0);
        if (visible <= 0) return 0;
        const half = visible / 2;
        const min = margin + half;
        const max = DESIGN_WIDTH - margin - half;
        if (min > max) return DESIGN_WIDTH / 2 - centerX;
        return Math.max(min, Math.min(max, centerX)) - centerX;
      }

      function renderSubtitleText(subtitle, text, settings = {}, cueStyle = 'normal', cueTextStyle = {}, textSpans = [], secondText = '', secondTextSpans = []) {
        const value = String(text || '');
        const lines = value.split(/\r?\n/);
        const secondValue = String(secondText || '');
        const secondLines = secondValue ? secondValue.split(/\r?\n/) : [];
        const fontPx = parsePixels(settings.fontSize || settings.publicFontSize, 58);
        const widthPercent = parsePercent(settings.maxWidth || settings.publicMaxWidth, 90);
        const clipWidth = DESIGN_WIDTH * (widthPercent / 100);
        const shiftX = (parseOffset(settings.offsetX ?? settings.publicOffsetX) / 100) * DESIGN_WIDTH;
        const clipX = (DESIGN_WIDTH - clipWidth) / 2 + shiftX;
        const verticalAlign = settings.verticalAlign || settings.publicVerticalAlign;
        const centerY = getCenterY(verticalAlign, settings.paddingTop || settings.publicPaddingTop)
          + (parseOffset(settings.offsetY ?? settings.publicOffsetY) / 100) * DESIGN_HEIGHT;
        const layout = layoutStageText(lines.length, secondLines.length, fontPx, settings.secondScale, centerY, verticalAlign);
        const fill = settings.color || settings.publicTextColor || '#F3E7B3';
        const fontFamily = settings.fontFamily || settings.publicFontFamily || 'Helvetica, Arial, sans-serif';
        const fontStyle = cueStyle === 'italic' ? 'italic' : 'normal';
        const fontWeight = cueTextStyle.bold === false ? '400' : '800';
        const alignment = 'center'; // Sténtor Lite: sopratitoli sempre centrati
        const textAnchor = alignment === 'left' ? 'start' : alignment === 'right' ? 'end' : 'middle';
        const textX = alignment === 'left' ? clipX : alignment === 'right' ? clipX + clipWidth : DESIGN_WIDTH / 2 + shiftX;

        subtitle.replaceChildren();
        subtitle.setAttribute('aria-label', [value, secondValue].filter(Boolean).join('\n'));

        const clipId = `stageTextClip-${subtitle.dataset.layer || '0'}`;
        const defs = createSvgElement('defs');
        const clipPath = createSvgElement('clipPath', { id: clipId });
        clipPath.appendChild(createSvgElement('rect', { x: clipX, y: -DESIGN_HEIGHT, width: clipWidth, height: DESIGN_HEIGHT * 3 }));
        defs.appendChild(clipPath);
        subtitle.appendChild(defs);

        const group = createSvgElement('g', { 'clip-path': `url(#${clipId})` });
        function appendLines(blockLines, ys, linePx, spans) {
          var lineStart = 0;
          blockLines.forEach((line, index) => {
            const textNode = createSvgElement('text', {
              x: textX,
              y: ys[index],
              'text-anchor': textAnchor,
              'dominant-baseline': 'middle',
              fill,
              'font-family': fontFamily,
              'font-size': linePx,
              'font-style': fontStyle,
              'font-weight': fontWeight,
              'letter-spacing': '0.005em',
            });
            styledLineSegments(line, lineStart, spans).forEach((segment) => {
              const attrs = {
                'font-style': segment.italic === true ? 'italic' : segment.italic === false ? 'normal' : fontStyle,
                'font-weight': segment.bold === true ? '800' : segment.bold === false ? '400' : fontWeight,
              };
              if (segment.underline === true) attrs['text-decoration'] = 'underline';
              if (segment.underline === false) attrs['text-decoration'] = 'none';
              if (segment.color) attrs.fill = segment.color;
              if (Number.isFinite(Number(segment.fontScale))) attrs['font-size'] = linePx * Number(segment.fontScale);
              const tspan = createSvgElement('tspan', attrs);
              tspan.textContent = segment.text || '\u00A0';
              textNode.appendChild(tspan);
            });
            group.appendChild(textNode);
            lineStart += line.length + 1;
          });
        }

        appendLines(lines, layout.primaryY, fontPx, textSpans);
        if (layout.separator) {
          // Seconda lingua: breve trattino centrale, poi il testo più piccolo.
          group.appendChild(createSvgElement('line', {
            x1: textX - layout.separator.width / 2,
            x2: textX + layout.separator.width / 2,
            y1: layout.separator.y,
            y2: layout.separator.y,
            stroke: fill,
            'stroke-opacity': 0.6,
            'stroke-width': layout.separator.thickness,
            'stroke-linecap': 'round',
          }));
          appendLines(secondLines, layout.secondY, layout.secondFontPx, secondTextSpans);
        }
        subtitle.appendChild(group);

        // La misura richiede che il livello sia già nella pagina.
        const widths = Array.from(group.querySelectorAll('text')).map((node) => node.getComputedTextLength());
        const fitX = Math.round(fitStageShiftX(DESIGN_WIDTH / 2 + shiftX, Math.max(0, ...widths), clipWidth));
        if (fitX) group.setAttribute('transform', `translate(${fitX} 0)`);
      }

      // Passaggio tra battute, scelto per ogni schermo (Schermi → Aspetto):
      //   none       cambio netto
      //   crossfade  la nuova battuta sfuma sopra la vecchia
      //   fade       la vecchia sparisce, poi compare la nuova (il comportamento di sempre)
      //   slide      la vecchia sale e svanisce, la nuova arriva dal basso
      // transitionMs è la durata di ogni fase. Se arriva una battuta nuova a passaggio in corso,
      // i livelli in uscita spariscono subito: le animazioni non si accodano mai.
      const TRANSITIONS = ['none', 'crossfade', 'fade', 'slide'];

      function getTransition(settings = {}) {
        const effect = TRANSITIONS.includes(settings.transition) ? settings.transition : 'fade';
        const parsed = Number.parseInt(settings.transitionMs, 10);
        const ms = effect === 'none' ? 0 : Math.max(0, Math.min(1200, Number.isFinite(parsed) ? parsed : 120));
        return { effect: ms > 0 ? effect : 'none', ms };
      }

      function createLayer() {
        layerCounter += 1;
        const layer = createSvgElement('svg', {
          class: 'subtitleLayer',
          viewBox: `0 0 ${DESIGN_WIDTH} ${DESIGN_HEIGHT}`,
          preserveAspectRatio: 'xMidYMid meet',
          role: 'img',
        });
        layer.dataset.layer = String(layerCounter);
        return layer;
      }

      function removeLeavingLayers() {
        leavingLayers.forEach((entry) => {
          window.clearTimeout(entry.timer);
          entry.layer.remove();
        });
        leavingLayers = [];
      }

      function leaveLayer(layer, effect, ms, slidePx) {
        if (effect === 'none') {
          layer.remove();
          return;
        }
        // La transizione parte dallo stato in cui il livello si trova, anche se stava ancora entrando.
        layer.style.transition = `opacity ${ms}ms ease-out, transform ${ms}ms ease-out`;
        layer.style.opacity = '0';
        if (effect === 'slide') layer.style.transform = `translateY(${-slidePx}px)`;
        const entry = { layer, timer: 0 };
        entry.timer = window.setTimeout(() => {
          layer.remove();
          leavingLayers = leavingLayers.filter((item) => item !== entry);
        }, ms + 60);
        leavingLayers.push(entry);
      }

      function enterLayer(layer, effect, ms, afterOutgoing, slidePx) {
        if (effect === 'none') return;
        layer.style.transition = 'none';
        layer.style.opacity = '0';
        if (effect === 'slide') layer.style.transform = `translateY(${slidePx}px)`;
        layer.getBoundingClientRect(); // fissa lo stato di partenza prima di animare
        // Con lo stacco la battuta nuova aspetta che la vecchia sia sparita.
        const delay = effect === 'fade' && afterOutgoing ? ms : 0;
        layer.style.transition = `opacity ${ms}ms ease-out ${delay}ms, transform ${ms}ms ease-out ${delay}ms`;
        layer.style.opacity = '1';
        layer.style.transform = 'translateY(0)';
      }

      function applyPayload(payload) {
        if (!payload || !payload.settings) return;

        const settings = payload.settings;
        const text = payload.blackout ? '' : payload.text || '';
        const secondText = payload.blackout ? '' : payload.secondText || '';
        const nextText = [text, secondText].filter(Boolean).join('\n\u2014\n');
        const { effect, ms } = getTransition(settings);
        const render = (layer) => renderSubtitleText(layer, text, settings, payload.cueStyle, payload.cueTextStyle, payload.textSpans || [], secondText, payload.secondTextSpans || []);

        // Stesso testo con stile o posizione diversi (es. mentre lo si sposta): si ridisegna senza effetto.
        const sameText = nextText === lastRawText && Boolean(nextText);
        lastRawText = nextText;
        lastPayload = payload;
        lastUpdatedAt = payload.updatedAt || Date.now();
        stage.style.background = settings.background || '#000000';
        canvas.style.background = settings.background || '#000000';
        document.body.classList.toggle('debug-empty', !nextText && !payload.blackout);

        if (sameText && currentLayer) {
          render(currentLayer);
          updateScale();
          return;
        }

        removeLeavingLayers();
        const outgoing = currentLayer;
        currentLayer = null;
        const slidePx = parsePixels(settings.fontSize || settings.publicFontSize, 58) * 0.45;
        // Lo stacco ha senso solo se la battuta che esce si vede ancora: avanzando in fretta
        // (la precedente non era ancora comparsa) la nuova entra subito.
        const outgoingVisible = Boolean(outgoing) && Number(window.getComputedStyle(outgoing).opacity) > 0.05;
        if (outgoing) leaveLayer(outgoing, effect, ms, slidePx);
        if (nextText) {
          const incoming = createLayer();
          canvas.appendChild(incoming);
          render(incoming);
          enterLayer(incoming, effect, ms, outgoingVisible, slidePx);
          currentLayer = incoming;
        }
        updateScale();
      }

      function readStoredPayload() {
        try {
          const raw = window.localStorage.getItem(PAYLOAD_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          return null;
        }
      }

      function refreshFromStorage() {
        const payload = readStoredPayload();
        if (!payload) {
          document.body.classList.add('debug-empty');
          return;
        }
        if (payload.updatedAt && payload.updatedAt === lastUpdatedAt) return;
        applyPayload(payload);
      }

      window.addEventListener('resize', updateScale);
      // Quando arriva un carattere web le larghezze cambiano: la battuta in onda si ridisegna sul posto.
      document.fonts?.addEventListener?.('loadingdone', () => {
        if (lastPayload && currentLayer) applyPayload(lastPayload);
      });
      window.addEventListener('storage', (event) => {
        if (event.key !== PAYLOAD_KEY || !event.newValue) return;
        try { applyPayload(JSON.parse(event.newValue)); } catch (error) {}
      });
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'OPENSURTITLES_PUBLIC_STAGE_UPDATE') {
          if (SCREEN_ID && event.data.screenId && event.data.screenId !== SCREEN_ID) return;
          if (SCREEN_ID && event.data.payload?.screenId && event.data.payload.screenId !== SCREEN_ID) return;
          applyPayload(event.data.payload);
        }
      });
      window.addEventListener('dblclick', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      });

      // Comandi da tastiera anche nella finestra dello schermo: gli stessi tasti della regia
      // (card "Scorciatoie"; predefiniti Spazio/→ avanti, Maiusc+Spazio/← indietro, B buio, F schermo intero).
      // Il comando va alla finestra di regia sia con postMessage sia con localStorage, con lo stesso id:
      // la regia lo esegue una volta sola.
      var CONTROL_TYPE = 'STENTORE_CONTROL';
      var CONTROL_STORAGE_KEY = 'stentore-control-command-v1';
      var DEFAULT_KEYS = {
        next: [{ code: 'Space' }, { code: 'ArrowRight' }],
        previous: [{ code: 'Space', shift: true }, { code: 'ArrowLeft' }],
        blackout: [{ code: 'KeyB' }],
        fullscreen: [{ code: 'KeyF' }],
      };
      function loadKeys() {
        try {
          var saved = JSON.parse(window.localStorage.getItem('stentor.shortcuts.v1') || 'null');
          if (!saved || typeof saved !== 'object') return DEFAULT_KEYS;
          var keys = {};
          Object.keys(DEFAULT_KEYS).forEach(function (action) {
            keys[action] = Array.isArray(saved[action]) ? saved[action] : DEFAULT_KEYS[action];
          });
          return keys;
        } catch (error) {
          return DEFAULT_KEYS;
        }
      }
      function actionForEvent(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return null;
        var keys = loadKeys();
        var actions = Object.keys(keys);
        for (var i = 0; i < actions.length; i += 1) {
          var list = keys[actions[i]] || [];
          for (var j = 0; j < list.length; j += 1) {
            if (list[j] && list[j].code === event.code && Boolean(list[j].shift) === Boolean(event.shiftKey)) return actions[i];
          }
        }
        return null;
      }
      function sendControl(comando) {
        var command = { type: CONTROL_TYPE, id: Date.now() + '-' + Math.random().toString(36).slice(2), comando: comando, origine: 'schermo', ricevutoAlle: Date.now() };
        try { if (window.opener && !window.opener.closed) window.opener.postMessage(command, '*'); } catch (error) {}
        try { window.localStorage.setItem(CONTROL_STORAGE_KEY, JSON.stringify(command)); } catch (error) {}
      }
      window.addEventListener('keydown', function (event) {
        var action = actionForEvent(event);
        if (!action) return;
        event.preventDefault();
        if (event.repeat) return;
        if (action === 'next') sendControl('avanti');
        else if (action === 'previous') sendControl('indietro');
        else if (action === 'blackout') sendControl('alterna_buio');
        else if (action === 'fullscreen') {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
          else document.exitFullscreen?.();
        }
      });

      window.__STENTORE_APPLY_PUBLIC_PAYLOAD = applyPayload;
      updateScale();
      refreshFromStorage();
      window.setInterval(refreshFromStorage, 150);
    })();
  </script>
</body>
</html>
