[package]
name = "stentor"
version = "0.10.5"
description = "Sténtor Lite — sopratitoli per il teatro dal vivo"
authors = ["Leonardo Mancini"]
license = "EUPL-1.2"
edition = "2021"

[features]
default = ["self-update"]
# Aggiornamento dall'app (plugin updater e riavvio). Presente nel .dmg, su Windows e su Linux.
self-update = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
# Copia per il Mac App Store: gli aggiornamenti li fa l'App Store e Apple non accetta app che
# contengano un proprio sistema di aggiornamento (linea guida 2.4.5). Si compila SENZA le
# funzioni predefinite: `tauri build --features app-store -- --no-default-features`
# (workflow «Pacchetto Mac App Store»); così il plugin updater non entra nel programma.
app-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
