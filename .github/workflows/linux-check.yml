# Compila solo i pacchetti Linux (.deb e .rpm, Intel/AMD) per provarli, senza creare Release.
# Il pacchetto è sotto «Artifacts» dell'esecuzione (14 giorni).
# Su Linux il nome del pacchetto non può avere la «é»: vedi src-tauri/tauri.linux.conf.json.

name: Prova pacchetti Linux

on:
  workflow_dispatch:
  push:
    branches:
      - claude/linux-deb

jobs:
  linux:
    name: Linux Intel/AMD
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev xdg-utils file rpm

      - name: Installa le dipendenze
        run: npm ci

      - name: Compila
        run: npx tauri build --bundles deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Controlla il pacchetto
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          dir="$RUNNER_TEMP/deb"
          dpkg-deb -x "$deb" "$dir"
          info=$(dpkg-deb -f "$deb" Package Version Architecture)
          desktop=$(cat "$dir"/usr/share/applications/*.desktop)
          files=$(cd "$dir" && find usr/bin usr/share/applications -type f)
          msg=$(printf '%s\n\n%s\n\n%s' "$info" "$desktop" "$files" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Pacchetto .deb::$msg"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-pacchetti
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 14
