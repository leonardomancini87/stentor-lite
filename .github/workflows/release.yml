# Compila Sténtor Lite per macOS, Windows e Linux e prepara una Release (in bozza) su GitHub.
#
# Come si usa:
#   - da GitHub: Actions → "Pubblica Sténtor Lite" → Run workflow (sceglie il ramo), oppure
#   - dal Terminale: git tag v0.8.0 && git push pubblico v0.8.0
# Alla fine, in Releases trovi una bozza con il .dmg (Mac), gli installatori .exe/.msi (Windows)
# e i pacchetti .deb/.rpm/.AppImage (Linux, per processori Intel/AMD e ARM):
# controllala e premi "Publish release".
#
# Mac: l'app viene firmata e notarizzata con i segreti del repository
# (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (password specifica per app), APPLE_TEAM_ID
# Se mancano (per esempio in una copia del repository), l'app Mac è firmata "ad hoc"
# (vedi signingIdentity in tauri.conf.json) e macOS mostra un avviso di sicurezza.
# Windows: l'installatore non è firmato, quindi SmartScreen mostra un avviso.

name: Pubblica Sténtor Lite

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Due compilazioni Mac separate (più affidabili del pacchetto "universal"):
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ''
            rust_targets: ''
          # Linux su Ubuntu 22.04: i pacchetti funzionano anche sulle versioni più recenti.
          - name: Linux Intel/AMD
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - name: Linux ARM
            platform: ubuntu-22.04-arm
            args: ''
            rust_targets: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev xdg-utils file

      - name: Installa le dipendenze
        run: npm ci

      - name: Test
        run: npm test

      # Firma Apple solo se i segreti esistono: se passano vuoti, la compilazione Mac
      # prova a importare un certificato inesistente e si ferma.
      - name: Firma Apple (solo se configurata)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Nessun certificato Apple: l'app Mac sarà firmata ad hoc (non notarizzata)."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              delimiter="EOF_$(uuidgen)"
              { echo "$name<<$delimiter"; echo "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Compila e allega alla Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Sténtor Lite __VERSION__'
          releaseBody: |
            Beta di Sténtor Lite __VERSION__.

            **Mac**: scarica il file `.dmg` (`aarch64` per i Mac con chip Apple M1/M2/M3/M4, `x64` per i Mac Intel), trascina Sténtor Lite in Applicazioni. L'app è firmata e notarizzata da Apple: al primo avvio macOS chiede solo di confermare l'apertura.
            **Windows**: scarica l'installatore `.exe`. Se compare "Windows ha protetto il PC": Ulteriori informazioni → Esegui comunque.
            **Linux** (in prova): su Ubuntu e Debian scarica il file `.deb` (`amd64` per i computer Intel/AMD, `arm64` per quelli ARM) e aprilo con un doppio clic, oppure `sudo apt install ./nome-del-file.deb`. Per Fedora c'è il file `.rpm`; per le altre distribuzioni l'`.AppImage`.

            Novità di questa versione: [CHANGELOG.md](https://github.com/leonardomancini87/stentor-lite/blob/main/CHANGELOG.md).
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
